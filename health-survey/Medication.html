<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body>

    <div class="max-w-md mx-auto mt-10 p-6 bg-white rounded-lg">
    <h2 class="text-2xl font-bold mb-4 text-center text-gray-800">Medication Details</h2>
    </div>
    <form action="#" method="POST" class="space-y-4 max-w-md mx-auto mt-10 bg-white p-6 rounded-lg shadow-md">
      <!-- Medication Name -->
      <div>
        <label for="medication-name" class="block text-sm font-medium text-gray-700">Medication Name</label>
        <input
          type="text"
          id="medication-name"
          name="medication-name"
          placeholder="Enter medication name"
          class="mt-1 w-full px-4 py-2 border border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500"
          required
        />
      </div>

      <!-- Dosage -->
      <div>
        <label for="dosage" class="block text-sm font-medium text-gray-700">Dosage (mg)</label>
        <input
          type="number"
          id="dosage"
          name="dosage"
          placeholder="Dosage"
          class="mt-1 w-full px-4 py-2 border border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500"
          required
        />
      </div>

      <fieldset>
    <legend class="block text-sm font-medium text-gray-700 mb-2">Time of Day for Medication</legend>
    <div class="space-y-2">
      <label class="inline-flex items-center">
        <input type="checkbox" value="morning" class="form-checkbox text-blue-600 focus:ring-blue-500" />
        <span class="ml-2 text-gray-700">Morning</span>
      </label>
      <label class="inline-flex items-center">
        <input type="checkbox" value="afternoon" class="form-checkbox text-blue-600 focus:ring-blue-500" />
        <span class="ml-2 text-gray-700">Afternoon</span>
      </label>
      <label class="inline-flex items-center">
        <input type="checkbox" value="night" class="form-checkbox text-blue-600 focus:ring-blue-500" />
        <span class="ml-2 text-gray-700">Night</span>
      </label>
    </div>
  </fieldset>

      <!-- Save Button -->
      <button type="submit" class="w-full bg-blue-600 text-white py-2 px-4 rounded-md hover:bg-blue-700 transition duration-200">
        Save
      </button>

    
  </body>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body>
   <div class="max-w-sm mx-auto mt-10 bg-white p-6 rounded-ig shadow-md">
    <h2 class="text-2xl font-bold text-center text-gray-800 mb-6">Sign in</h2>
<form action="#" method="POST" class="space-y-4">
    
    <!-- Aadhar Number -->
    <div>
      <label for="aadhar" class="block text-sm font-medium text-gray-700">Aadhar Number</label>
      <input type="number" id="aadhar" name="aadhar" required
             class="mt-1 block w-full px-4 py-2 border border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500" />
    </div> 
    <!-- Password -->
    <div>
      <label for="password" class="block text-sm font-medium text-gray-700">Password</label>
      <input type="password" id="password" name="password" required
             class="mt-1 block w-full px-4 py-2 border border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500" />
    </div>

    <!-- Confirm Password -->
    <div>
      <label for="confirm-password" class="block text-sm font-medium text-gray-700">Confirm Password</label>
      <input type="password" id="confirm-password" name="confirm-password" required
             class="mt-1 block w-full px-4 py-2 border border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500" />
    </div>
     
    <button type="submit" class="w-full bg-blue-600 text-white py-2 px-4 rounded-md hover:bg-blue-700 active:bg-blue-800 transition duration-200">
      Confirm
    </button>
    </form>
</div>
</body>

</html>

<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body>
    <div class="max-w-md mx-auto mt-10 p-6 bg-white rounded-lg ">
  <h2 class="text-2xl font-bold mb-4 text-center text-gray-800">Know your Sugar Level.</h2>
  <div class="max-w-md mx-auto mt-10 p-6 bg-white rounded-lg shadow-md space-y-4">
  <!-- Time of Reading Dropdown -->
  <label class="block text-sm font-medium text-gray-700">Time of Reading</label>
  <select class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
    <option value="fasting">Fasting (Before Food)</option>
    <option value="after_food">After Food</option>
    <option value="any_time">Any Time in a Day</option>
  </select>

  <!-- Sugar Level Input -->
  <label class="block text-sm font-medium text-gray-700">Sugar Level (mg/dL)</label>
  <input type="number" placeholder="Enter sugar level" class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" />

  <!-- Save Button -->
  <button class="w-full bg-blue-600 text-white py-2 px-4 rounded-md hover:bg-blue-700 transition duration-200">
    Save
  </button>
    <form action="next.html" class="flex justify-end mt-6">
        <button type="submit" class="mt-6 w-center bg-blue-500 text-white py-2 px-4 rounded-md hover:bg-blue-600 transition">
        Next
        </button>

</div>

  
  </body>
  </html>
